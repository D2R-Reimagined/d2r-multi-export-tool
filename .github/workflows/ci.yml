name: Build Check

on:
  # Manual-only: this workflow is intentionally NOT triggered on
  # `pull_request` or `push` to avoid burning Actions minutes on every
  # commit to an open PR (a Windows build runs ~3–4 min). Run it on
  # demand from **Actions → Build Check → Run workflow** before merging.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-check
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ContinuousIntegrationBuild: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (pinned to global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\D2RMultiExport.sln

      - name: Build (Release)
        run: dotnet build .\D2RMultiExport.sln -c Release --no-restore -p:TreatWarningsAsErrors=false

      # Level A/B deterministic regressions (docs/TESTING.md). Both real-data
      # cases explicitly skip here; required Level C remains a local/release gate.
      - name: Library tests (Release)
        run: dotnet test .\D2RMultiExport.Tests\D2RMultiExport.Tests.csproj -c Release --no-build

      - name: Setup Python for independent property-audit tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Property-audit tests
        run: python -m unittest discover -s tools -p test_property_range_audit.py -v

      # Headless desktop regressions; real-data tests skip without local source roots.
      - name: Desktop tests (Release)
        run: dotnet test .\D2RMultiExport.Client.Tests\D2RMultiExport.Client.Tests.csproj -c Release --no-build
